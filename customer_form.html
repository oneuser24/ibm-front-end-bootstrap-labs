<!doctype html>
<html>
    <head>
        <!--Bootstrap via CDN-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        

    </head>

    <body class = "mx-3">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Navbar</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="#">About Us</a>
                    </li>
                    <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Help
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Technical documentation</a></li>
                        <li><a class="dropdown-item" href="#">Talk to us</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#">FQAs</a></li>
                    </ul>
                    </li>

                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                    <button class="btn btn-outline-info">Search</button>
                </form>
                </div>
            </div>
        </nav>

        <form>
            <div class="my-3">
                <label for="name" class="form-label fw-bold">Full Name</label>
                <input type="text" class="form-control" id="name" style="width: 500px;">                
              </div>
            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label"><b>Email address</b></label>
              <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" style="width: 500px;">
              <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
            </div>
            <div class="mb-3">
                <label for="reason" class="form-label"><b>Reason for contacting us:</b></label><br>
                    
                        <select id="reason" class="btn btn-secondary dropdown-toggle" style="background-color: rgb(255, 255, 255);color: black; text-align: center; width: 250px;" >
                            <option value="billing" selected style=" text-align: left;">Billing</option>
                            <option value="techsupport" style=" text-align: left;">Technical Support</option>
                            <option value="feedback" style=" text-align: left;">Complaints and Feedback</option>
                        </select>
                                    
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label"><b>Comment:</b></label>
                    <textarea name="message" id="message" cols="65" rows="10" style="resize: none;"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>

                <button type="reset" class="btn btn-secondary">RESET</button>
            
        </form>

        
        
    </body>

</html>
